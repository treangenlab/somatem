# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
# # TODO nf-core: Add a description of the module and list keywords
name: "seqscreen"
description: write your description here
keywords:
- sort
- example
- genomics
tools:
## TODO nf-core: Add a description and other details for the software below
- "seqscreen":
    description: "SeqScreen was created to sensitively assign taxonomic classifications,
      functional annotations, and Functions of Sequences of Concern (FunSoCs) to single,
      short DNA sequences or open reading frames."
    homepage: "None"
    documentation: "None"
    tool_dev_url: "None"
    doi: ""
    licence: ['GPL v3']
    identifier: biotools:seqscreen

input:
  ### TODO nf-core: Add a description of all of the variables used as input
- - meta:
      type: map
      description: |
        Groovy Map containing sample information
        e.g. `[ id:'sample1' ]`
  - bam:
      type: file
      description: Sorted BAM/CRAM/SAM file
      pattern: "*.{bam,cram,sam}"
      ontologies:
      - edam: "http://edamontology.org/format_2572"     # BAM
      - edam: "http://edamontology.org/format_2573"     # CRAM
      - edam: "http://edamontology.org/format_3462"     # SAM

output:
  ### TODO nf-core: Add a description of all of the variables used as output
  bam:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - "*.bam":
        type: file
        description: Sorted BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies:
        - edam: "http://edamontology.org/format_2572"     # BAM
        - edam: "http://edamontology.org/format_2573"     # CRAM
        - edam: "http://edamontology.org/format_3462"     # SAM
  versions_seqscreen:
  - - "${task.process}":
        type: string
        description: The name of the process
    - "seqscreen":
        type: string
        description: The name of the tool
    - "echo 4.5":
        type: eval
        description: The expression to obtain the version of the tool

topics:
  versions:
  - - ${task.process}:
        type: string
        description: The name of the process
    - seqscreen:
        type: string
        description: The name of the tool
    - echo 4.5:
        type: eval
        description: The expression to obtain the version of the tool
authors:
- "@ppreshant"
maintainers:
- "@ppreshant"
