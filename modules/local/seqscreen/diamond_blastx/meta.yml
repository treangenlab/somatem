name: "seqscreen_diamond_blastx"
description: Run DIAMOND BLASTX against the SeqScreen UniRef database
keywords:
  - seqscreen
  - diamond
  - blastx
tools:
  - "diamond":
      description: "Accelerated protein aligner"
      homepage: "https://github.com/bbuchfink/diamond"
      documentation: "https://github.com/bbuchfink/diamond/wiki"
      licence: "['GPL-3.0-only']"
input:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - fasta:
      type: file
      description: Input FASTA file
      pattern: "*.{fa,fasta,fna}"
  - db:
      type: directory
      description: SeqScreen database directory
output:
  - btab:
      type: file
      description: DIAMOND tabular output
      pattern: "*.btab"
  - xml:
      type: file
      description: DIAMOND XML output
      pattern: "*.xml"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@ppreshant"
