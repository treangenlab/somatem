name: "seqscreen_centrifuge"
description: Classify FASTA records with the SeqScreen Centrifuge database
keywords:
  - seqscreen
  - centrifuge
  - taxonomy
tools:
  - "centrifuge":
      description: "Classifier for metagenomic sequences"
      homepage: "https://ccb.jhu.edu/software/centrifuge/"
      documentation: "https://ccb.jhu.edu/software/centrifuge/manual.shtml"
      licence: "['GPL-3.0-or-later']"
input:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - fasta:
      type: file
      description: Input FASTA file
      pattern: "*.{fa,fasta,fna}"
  - db:
      type: directory
      description: SeqScreen database directory
output:
  - results:
      type: file
      description: Centrifuge classification output
      pattern: "*.centrifuge"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@ppreshant"
