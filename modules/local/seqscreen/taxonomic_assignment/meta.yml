name: "seqscreen_taxonomic_assignment"
description: Generate SeqScreen taxonomic assignment reports for fast or sensitive mode
keywords:
  - seqscreen
  - taxonomy
  - report
tools:
  - "seqscreen":
      description: "SeqScreen pathogen detection and sequence-of-concern reporting"
      homepage: "https://gitlab.com/treangenlab/seqscreen"
      documentation: "https://gitlab.com/treangenlab/seqscreen"
      licence: "['GPL-3.0-or-later']"
input:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - btab:
      type: file
      description: BLASTX or DIAMOND tabular output
  - classifier_results:
      type: file
      description: Centrifuge results or cleaned BLASTN BTAB
output:
  - results:
      type: file
      description: Taxonomic assignment results
      pattern: "taxonomic_results.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@ppreshant"
