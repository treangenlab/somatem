name: "seqscreen_functional_assignment"
description: Generate SeqScreen functional assignment results from BLASTX hits
keywords:
  - seqscreen
  - function
  - funsocs
tools:
  - "seqscreen":
      description: "SeqScreen pathogen detection and sequence-of-concern reporting"
      homepage: "https://gitlab.com/treangenlab/seqscreen"
      documentation: "https://gitlab.com/treangenlab/seqscreen"
      licence: "['GPL-3.0-or-later']"
input:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - fasta:
      type: file
      description: Input FASTA file
  - blastx_btab:
      type: file
      description: BLASTX or DIAMOND tabular output
output:
  - results:
      type: file
      description: Functional assignment results
      pattern: "functional_results.txt"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@ppreshant"
