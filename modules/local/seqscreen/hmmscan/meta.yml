name: "seqscreen_hmmscan"
description: Translate FASTA records and scan Pfam HMM profiles with HMMER
keywords:
  - seqscreen
  - hmmscan
  - pfam
tools:
  - "hmmer":
      description: "Profile hidden Markov model sequence analysis"
      homepage: "http://hmmer.org/"
      documentation: "http://hmmer.org/documentation.html"
      licence: "['BSD-3-Clause']"
input:
  - meta:
      type: map
      description: Groovy Map containing sample information
  - fasta:
      type: file
      description: Input FASTA file
  - db:
      type: directory
      description: SeqScreen database directory
output:
  - outdir:
      type: directory
      description: Pfam HMM output directory
      pattern: "pfam_hmm"
  - versions:
      type: file
      description: File containing software versions
      pattern: "versions.yml"
authors:
  - "@ppreshant"
